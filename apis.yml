x-merger-note: >-
  PotlatchDeltic Corporation (Spokane, Washington; formerly Potlatch Corporation, renamed after the
  2018 Deltic Timber merger) ceased to exist as an independent public company on 2026-01-30, when its
  $8.2 billion all-stock merger of equals with Rayonier Inc. closed. Rayonier shareholders hold roughly
  54% and former PotlatchDeltic stockholders roughly 46% of the combined company; Rayonier CEO Mark
  McHugh leads it and PotlatchDeltic CEO Eric Cremers is executive chairman. The board elected to
  retain the Rayonier name and the NYSE ticker RYN. This profile is retained as a historical record;
  the live entity is catalogued at all/rayonier.
x-domain-status: successor-redirect
x-domain-note: >-
  potlatchdeltic.com is still registered and still controlled by the successor (GoDaddy, Cloudflare
  nameservers cloe/james.ns.cloudflare.com, created 2017-10-23, registry expiry 2027-10-23) but the
  apex and www now answer a blanket HTTP 301 to https://www.rayonier.com/ on EVERY path, including
  every /.well-known/ path, /openapi.json, /apis.json and /llms.txt. Four legacy subdomains are still
  live behind Cloudflare and each returns a clean HTTP 404 on every discovery path:
  customer.potlatchdeltic.com (customer login), supplier.potlatchdeltic.com (log-and-fiber supplier
  login), rlms.potlatchdeltic.com (Recreational Lease Management System) and
  woodproducts.potlatchdeltic.com (wood-products marketing). See well-known/potlatch-well-known.yml.
