description: >-
  PotlatchDeltic Corporation was a Spokane, Washington timberland real estate investment trust and
  diversified wood products manufacturer, formed in 2018 when Potlatch Corporation — a company whose
  roots reach back to the 1903 Potlatch Lumber Company in Idaho — merged with Deltic Timber
  Corporation of Arkansas. At the time of its own merger it owned roughly 2.2 million acres of
  timberland across Alabama, Arkansas, Georgia, Idaho, Louisiana, Minnesota, Mississippi and South
  Carolina, ran six sawmills and an industrial-grade plywood mill, and operated a rural land sales
  program and residential and commercial real estate development business in central Arkansas. It
  traded on Nasdaq as PCH. PotlatchDeltic ceased to exist as an independent company on 30 January
  2026, when its $8.2 billion all-stock merger of equals with Rayonier Inc. closed; the combined
  company retained the Rayonier name and the NYSE ticker RYN and holds over four million acres of US
  timberland. PotlatchDeltic never operated a public developer program: no developer portal, API
  reference, SDK, package, GitHub organization or machine-readable specification of any kind was ever
  published. Its integration surface was, and for the surviving legacy portals still is, a set of
  human login pages for log-and-fiber suppliers, customers and recreational lease holders. The
  corporate site now redirects wholesale to rayonier.com, so there is no live API surface to catalog.
  This profile is retained as a historical record; the live entity is catalogued at all/rayonier.
